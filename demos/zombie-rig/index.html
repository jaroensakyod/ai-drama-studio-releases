<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Rig – ต้นแบบ Cut-out Animation</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, "Noto Sans Thai", sans-serif; background:#1E1A19; color:#eee;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { font-size:18px; font-weight:600; margin:16px 0 4px; }
  p.sub { margin:0 0 10px; font-size:13px; color:#b9b0a8; }
  canvas { width:min(96vw,720px); aspect-ratio: 720/520; background:radial-gradient(#3a3533,#1E1A19 70%);
           border-radius:12px; display:block; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 8px; }
  button { background:#3B2F2A; color:#eee; border:1px solid #6F8B55; border-radius:999px; padding:8px 14px;
           font-size:14px; cursor:pointer; }
  button.on { background:#6F8B55; color:#fff; }
  label { font-size:13px; color:#b9b0a8; display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<h1>Zombie Rig: ต้นแบบ Cut-out Animation</h1>
<p class="sub">ชิ้นส่วนตัดจากภาพตัวเต็ม แล้วประกอบเป็นกระดูกด้วย Canvas</p>
<canvas id="c" width="720" height="520"></canvas>
<div class="bar" id="moves"></div>
<div class="bar">
  <label>ความเร็ว <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></label>
  <label><input id="bones" type="checkbox"> แสดงกระดูก</label>
</div>
<script>
// ---------- Rig: all parts were cut from the full-body reference, so they share one coordinate space ----------
// off: top-left of the part image in reference coords.  pivot: joint position in reference coords.
const OFF = {"torso": [107, 164], "head": [187, -27], "uarm_f": [229, 253], "farm_f": [277, 286], "arm_b": [337, 239], "thigh_b": [86, 335], "thigh_f": [212, 335], "shin_b": [63, 503], "shin_f": [263, 504]};
const RIG = {
  pelvis: { pivot:[215,372], z:0, children:['torso','thigh_b','thigh_f'] },
  torso:  { img:'torso',  pivot:[215,372], z:4, children:['head','uarm_f','arm_b'] },
  head:   { img:'head',   pivot:[305,192], z:6 },
  arm_b:  { img:'arm_b',  pivot:[358,282], z:-2 },
  uarm_f: { img:'uarm_f', pivot:[246,262], z:5, children:['farm_f'] },
  farm_f: { img:'farm_f', pivot:[262,316], z:5.5 },
  thigh_b:{ img:'thigh_b',pivot:[180,378], z:1, children:['shin_b'] },
  shin_b: { img:'shin_b', pivot:[126,506], z:0.5 },
  thigh_f:{ img:'thigh_f',pivot:[250,384], z:3, children:['shin_f'] },
  shin_f: { img:'shin_f', pivot:[290,508], z:2.5 },
};
const S = Math.sin, C = Math.cos, PI = Math.PI;
const pos = x => Math.max(0,x);
const MOVES = {
  'ท่าพัก (Rest)': t => ({}),
  'ยืน (Idle)': t => { const a=t*2.2; return {
    root:[0, S(a*2)*2], torso:S(a)*2.5, head:S(a+1)*5 + S(a*0.37)*3,
    uarm_f:S(a)*5, farm_f:S(a+0.6)*6, arm_b:S(a+0.4)*5,
    thigh_f:S(a)*1, thigh_b:-S(a)*1 }; },
  'เดิน (Walk)': t => { const a=t*4.2; return {
    root:[0, -Math.abs(S(a))*6], pelvis:S(a)*2, torso:S(a*2)*2, head:S(a*2+0.5)*5,
    thigh_f:4+S(a)*22, shin_f:pos(-C(a))*28, thigh_b:-12-S(a)*22, shin_b:pos(C(a))*28,
    uarm_f:-S(a)*10, farm_f:-S(a)*8, arm_b:S(a)*10 }; },
  'วิ่ง (Run)': t => { const a=t*7.5; return {
    root:[0, -Math.abs(S(a))*14+4], pelvis:-6+S(a)*3, torso:-4+S(a*2)*3, head:S(a*2)*6+6,
    thigh_f:S(a)*36, shin_f:pos(-C(a))*55, thigh_b:-14-S(a)*36, shin_b:pos(C(a))*55,
    uarm_f:-S(a)*30-10, farm_f:-15-S(a)*15, arm_b:S(a)*28-10 }; },
  'โจมตี (Attack)': t => { const p=t%1;
    const arm = p<.45 ? -150*easeInOut(p/.45) : p<.6 ? -150+150*easeOut((p-.45)/.15) : 0;
    const lean = p<.45 ? -easeInOut(p/.45) : p<.6 ? -1+2*easeOut((p-.45)/.15) : 1-easeInOut((p-.6)/.4);
    return { root:[lean*10,0], pelvis:lean*3, torso:lean*10, head:lean*8,
      uarm_f:arm*0.9, farm_f:arm*0.2, arm_b:arm,
      thigh_f:-lean*6, shin_f:lean*4, thigh_b:lean*4 }; },
  'ล้ม (Fall)': t => { const T=t%3.4, p=Math.min(1,T/1.0), e=easeIn(p),
      b=p>=1 ? Math.abs(S((T-1)*9))*Math.exp(-(T-1)*5)*8 : 0, c=p>=1 ? S((T-1)*5)*Math.min(1,(T-1)*2) : 0;
    return { root:[e*10, e*150 - b], rootRot:e*78, torso:e*4, head:-e*55 + c*4,
      uarm_f:-e*95 + c*18, farm_f:-e*5 - c*10, arm_b:-e*85 - c*18,
      thigh_f:e*12, shin_f:e*30, thigh_b:-e*5, shin_b:e*45 }; },
};
function easeInOut(x){ return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2; }
function easeOut(x){ return 1-Math.pow(1-x,3); }
function easeIn(x){ return x*x*x; }

const cv=document.getElementById('c'), ctx=cv.getContext('2d'); const imgs={};
const names=Object.values(RIG).filter(b=>b.img).map(b=>b.img);
Promise.all(names.map(n=>new Promise(r=>{const i=new Image(); i.onload=r; i.src=`parts/${n}.png`; imgs[n]=i;}))).then(()=>requestAnimationFrame(loop));

let current=Object.keys(MOVES)[1], tAcc=0, last=performance.now();
const bar=document.getElementById('moves');
for (const k of Object.keys(MOVES)) {
  const btn=document.createElement('button'); btn.textContent=k;
  btn.onclick=()=>{ current=k; tAcc=0; [...bar.children].forEach(c=>c.classList.toggle('on',c===btn)); };
  if (k===current) btn.classList.add('on'); bar.appendChild(btn);
}
const speedEl=document.getElementById('speed'), bonesEl=document.getElementById('bones');

function collect(name, parentPivot, M, pose, out) {
  const b=RIG[name];
  M = M.translate(b.pivot[0]-parentPivot[0], b.pivot[1]-parentPivot[1]).rotate(pose[name]||0);
  out.push({b, M});
  for (const c of (b.children||[])) collect(c, b.pivot, M, pose, out);
}
function loop(now) {
  const dt=(now-last)/1000; last=now; tAcc+=dt*parseFloat(speedEl.value);
  const pose=MOVES[current](tAcc);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(330,474,150,15,0,0,PI*2); ctx.fill();
  const [rx,ry]=pose.root||[0,0], k=0.7;
  const M0=new DOMMatrix().translate(300+rx, 296+ry).rotate(pose.rootRot||0).scale(k);
  const out=[]; collect('pelvis', RIG.pelvis.pivot, M0.translate(0,0), pose, out);
  // the first translate in collect is zero for the root
  out.sort((a,b)=>a.b.z-b.b.z);
  for (const {b,M} of out) if (b.img) {
    ctx.setTransform(M); const o=OFF[b.img];
    ctx.drawImage(imgs[b.img], o[0]-b.pivot[0], o[1]-b.pivot[1]);
  }
  ctx.setTransform(1,0,0,1,0,0);
  if (bonesEl.checked) { ctx.fillStyle='#ff3b3b';
    for (const {M} of out) { ctx.beginPath(); ctx.arc(M.e,M.f,4,0,PI*2); ctx.fill(); } }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
